name: Windows build check
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt
      - name: Cache Cargo registry and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-1.100.0-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.100.0-
      - name: Check formatting (informational)
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --release
      - name: Build release
        run: cargo build --release
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: neon-frontier-windows-x64
          path: target/release/neon-frontier.exe
          if-no-files-found: error
          retention-days: 30
