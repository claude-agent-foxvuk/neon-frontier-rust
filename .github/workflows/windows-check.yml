name: Windows build check
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/windows-check.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt
      - name: Cache Cargo registry and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-1.100.0-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.100.0-
      - name: Format sources and verify formatting
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Test with ECS diagnostics
        run: cargo test --release --features bevy/debug
      - name: Build release with ECS diagnostics
        run: cargo build --release --features bevy/debug
      - name: Launch Windows startup smoke test
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'neon-frontier-smoke.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'neon-frontier-smoke.stderr.log'
          $process = Start-Process -FilePath 'target/release/neon-frontier.exe' -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 10
          $exitedEarly = $process.HasExited
          if (-not $exitedEarly) {
            Stop-Process -Id $process.Id -Force
          }
          $log = ''
          if (Test-Path $stdout) { $log += (Get-Content $stdout -Raw) }
          if (Test-Path $stderr) { $log += (Get-Content $stderr -Raw) }
          if ($log) { Write-Host $log }
          if ($log -match 'error\[B000') {
            throw 'Bevy reported an ECS query conflict during startup, which crashes the game for players.'
          }
          if ($exitedEarly) {
            throw "The game exited during the 10-second startup smoke window with code $($process.ExitCode). See captured logs above."
          }
          Write-Host 'The game stayed alive through the startup smoke window.'
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: neon-frontier-windows-x64
          path: target/release/neon-frontier.exe
          if-no-files-found: error
          retention-days: 30
