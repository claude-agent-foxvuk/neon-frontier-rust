[package]
name = "neon-frontier"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[dependencies]
bevy = { version = "=0.20.1", features = ["system_font_discovery"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
